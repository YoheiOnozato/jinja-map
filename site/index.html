<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>群馬の神社マップ ― 社格・系統・由来</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { margin: 0; height: 100%; font-family: -apple-system, "Hiragino Sans", sans-serif; }
  #ui { position: absolute; z-index: 1000; top: 10px; left: 52px; right: 10px; max-width: 460px; }
  #searchrow { display: flex; box-shadow: 0 2px 8px #0004; border-radius: 24px; overflow: hidden; background: #fff; }
  #q { flex: 1; min-width: 0; border: 0; padding: 11px 14px; font-size: 16px; outline: none; background: transparent; }
  #go { border: 0; background: #b3261e; color: #fff; padding: 0 16px; font-size: 15px; }
  .chip { display: inline-block; margin: 6px 6px 0 0; padding: 6px 10px; background: #fff; border-radius: 16px;
          box-shadow: 0 1px 5px #0003; font-size: 13px; color: #1a56b0; border: 0; }
  #panel { display: none; margin-top: 6px; background: #fff; padding: 10px; border-radius: 10px; box-shadow: 0 2px 8px #0004; font-size: 14px; }
  #panel label { display: block; margin: 6px 0 2px; color: #555; font-size: 12px; }
  #panel select { width: 100%; padding: 6px; font-size: 15px; }
  #hint { margin-top: 6px; font-size: 12px; color: #444; background: #fffd; padding: 3px 8px; border-radius: 8px; display: inline-block; }
  .card { font-size: 13px; line-height: 1.5; max-height: 55vh; overflow-y: auto; }
  .card h3 { margin: 0 0 4px; font-size: 18px; }
  .tag { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 10px; margin: 0 4px 4px 0; background: #eee; }
  .tag.k { background: #5b3d9e; color: #fff; }
  .tag.r { background: #f6e3b4; color: #5a4300; }
  .card table { border-collapse: collapse; width: 100%; margin: 4px 0; }
  .card th { text-align: left; color: #666; font-weight: normal; white-space: nowrap; padding: 2px 8px 2px 0; vertical-align: top; }
  .card td { padding: 2px 0; }
  .card p { margin: 6px 0; }
  .card summary { color: #b3261e; font-weight: bold; cursor: pointer; margin: 6px 0; }
  .src { font-size: 11px; color: #777; }
  .pp { color: #1a56b0; text-decoration: underline; cursor: pointer; margin-right: 8px; }
  .links a { margin-right: 10px; }
  .leaflet-popup-content { margin: 12px 14px; }
</style>
</head>
<body>
<div id="ui">
  <div id="searchrow">
    <input id="q" type="search" placeholder="人物名・神社名・祭神で検索（例：徳川家康、新田義貞）">
    <button id="go">検索</button>
  </div>
  <button class="chip" id="toggle">≡ 絞り込み</button>
  <div id="panel">
    <label>社格</label>
    <select id="rankSel">
      <option value="1">すべて</option>
      <option value="2">社格・記事のある神社</option>
      <option value="3">式内社・県社など以上</option>
      <option value="5">名神大社・官幣大社以上</option>
      <option value="6">一宮・二十二社のみ</option>
    </select>
    <label>系統</label>
    <select id="kindSel"><option value="">すべて</option></select>
  </div>
  <div id="hint">読み込み中…</div>
</div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([36.5, 139.0], 9);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  attribution: '地図：<a href="https://maps.gsi.go.jp/development/ichiran.html">国土地理院</a> / データ：© OpenStreetMap contributors・Wikipedia (CC BY-SA)',
  maxZoom: 18
}).addTo(map);

const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RADIUS = {1: 3, 2: 5, 3: 6, 4: 8, 5: 11, 6: 14};
const PALETTE = ['#e6194b','#3cb44b','#4363d8','#f58231','#911eb4','#46a3a3','#c1a300','#8c564b','#e377c2','#17becf','#7f7f7f','#bcbd22','#1f77b4','#d62728','#2ca02c','#9467bd','#ff7f0e','#555'];
const kindColor = {};
let all = [], layer = L.layerGroup().addTo(map), personNames = [];

function colorOf(kind) {
  if (!kindColor[kind]) kindColor[kind] = PALETTE[Object.keys(kindColor).length % PALETTE.length];
  return kindColor[kind];
}

function popupHtml(p, lat, lon) {
  let h = '<div class="card"><h3>' + esc(p.name) + '</h3>';
  if (p.kind) h += '<span class="tag k">' + esc(p.kind) + '</span>';
  if (p.rank_label) h += '<span class="tag r">' + esc(p.rank_label) + '</span>';
  h += '<table>';
  const row = (k, v) => v ? '<tr><th>' + k + '</th><td>' + esc(v) + '</td></tr>' : '';
  h += row('主祭神', p.deity) + row('社格', p.rank_label) + row('創建', p.founded) + row('所在地', p.address);
  if (p.website && /^(https?:\/\/)?[\w.-]+\.[a-z]{2,}/i.test(p.website)) {
    const u = /^https?:/.test(p.website) ? p.website : 'https://' + p.website;
    h += '<tr><th>公式サイト</th><td><a target="_blank" rel="noopener" href="' + esc(u) + '">' + esc(p.website.slice(0, 40)) + '</a></td></tr>';
  }
  h += '</table>';
  if (p.intro) h += '<p>' + esc(p.intro) + '</p>';
  if (p.persons && p.persons.length) {
    h += '<p>ゆかりの人物：' + p.persons.map(x => '<span class="pp" data-p="' + esc(x) + '">' + esc(x) + '</span>').join('') + '</p>';
  }
  if (p.history) h += '<details><summary>▶ 歴史・由来（Wikipedia）</summary><p>' + esc(p.history).replace(/\n/g, '<br>') + '</p></details>';
  if (p.wikipedia) h += '<div class="src">出典：Wikipedia「' + esc(p.wikipedia) + '」(CC BY-SA)</div>';
  h += '<div class="links">';
  if (p.wikipedia) h += '<a target="_blank" rel="noopener" href="https://ja.wikipedia.org/wiki/' + encodeURIComponent(p.wikipedia) + '">Wikipedia</a>';
  h += '<a target="_blank" rel="noopener" href="https://ndlsearch.ndl.go.jp/search?cs=bib&keyword=' + encodeURIComponent(p.name) + '">国立国会図書館</a>';
  h += '<a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lon + '">Googleマップ</a>';
  if (p.wikidata) h += '<a target="_blank" rel="noopener" href="https://www.wikidata.org/wiki/' + esc(p.wikidata) + '">Wikidata</a>';
  h += '</div></div>';
  return h;
}

function draw(list, fit) {
  layer.clearLayers();
  list.slice().sort((a, b) => a.properties.rank - b.properties.rank).forEach(f => {
    const p = f.properties, [lon, lat] = f.geometry.coordinates;
    const m = L.circleMarker([lat, lon], {
      radius: RADIUS[p.rank] || 3, color: '#fff', weight: 1,
      fillColor: colorOf(p.kind), fillOpacity: p.rank >= 2 ? 0.9 : 0.55
    });
    m.bindPopup(() => popupHtml(p, lat, lon), { maxWidth: 340, autoPanPadding: [20, 80] });
    m.bindTooltip(esc(p.name));
    m.addTo(layer);
  });
  document.getElementById('hint').textContent = list.length + ' / ' + all.length + ' 社を表示';
  if (fit && list.length) {
    map.fitBounds(L.latLngBounds(list.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]])), { padding: [40, 40], maxZoom: 13 });
  }
}

function apply(fit) {
  const q = document.getElementById('q').value.trim();
  const minRank = +document.getElementById('rankSel').value;
  const kind = document.getElementById('kindSel').value;
  const list = all.filter(f => {
    const p = f.properties;
    if (p.rank < minRank) return false;
    if (kind && p.kind !== kind) return false;
    if (!q) return true;
    return (p.name + ' ' + p.deity + ' ' + (p.persons || []).join(' ') + ' ' + p.history + ' ' + p.intro).includes(q);
  });
  draw(list, fit && !!q);
}

fetch('data/shrines.geojson').then(r => r.json()).then(g => {
  all = g.features;
  const kinds = [...new Set(all.map(f => f.properties.kind))].sort();
  const sel = document.getElementById('kindSel');
  kinds.forEach(k => sel.insertAdjacentHTML('beforeend', '<option>' + esc(k) + '</option>'));
  apply(false);
}).catch(() => { document.getElementById('hint').textContent = 'データを読み込めませんでした'; });

document.getElementById('go').onclick = () => apply(true);
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') apply(true); });
document.getElementById('q').addEventListener('input', () => { if (!document.getElementById('q').value) apply(false); });
document.getElementById('rankSel').onchange = () => apply(false);
document.getElementById('kindSel').onchange = () => apply(false);
document.getElementById('toggle').onclick = () => {
  const p = document.getElementById('panel');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
};
document.addEventListener('click', e => {
  const t = e.target.closest('.pp');
  if (t) { document.getElementById('q').value = t.dataset.p; map.closePopup(); apply(true); }
});
</script>
</body>
</html>
